name: Deploy to GitHub Pages

# Every push to main builds the site and publishes the output to the gh-pages
# branch, which GitHub Pages serves. The branch is rewritten on each deploy so
# it only ever holds the latest build.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Publishing two essays in quick succession queues the second build rather
# than cancelling the first.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Publish dist to gh-pages
        env:
          TOKEN: ${{ github.token }}
        run: |
          cd dist
          touch .nojekyll
          git init --initial-branch=gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
